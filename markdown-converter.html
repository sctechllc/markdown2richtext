<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → Rich Text Converter</title>
<script src="https://cdn.jsdelivr.net/npm/marked@14.0.0/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #1a1a2e; color: #e0e0e0; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #16213e; border-bottom: 1px solid #0f3460; }
  .toolbar h1 { font-size: 16px; margin-right: auto; color: #e94560; }
  .toolbar button, .toolbar label { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; background: #0f3460; color: #e0e0e0; transition: background .2s; }
  .toolbar button:hover, .toolbar label:hover { background: #e94560; }
  .toolbar input[type="file"] { display: none; }
  .panels { display: flex; flex: 1; min-height: 0; }
  .panel { flex: 1; display: flex; flex-direction: column; }
  .panel-header { padding: 6px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; background: #16213e; border-bottom: 1px solid #0f3460; color: #888; }
  #input { flex: 1; resize: none; padding: 16px; border: none; outline: none; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 14px; line-height: 1.6; background: #1a1a2e; color: #e0e0e0; }
  .divider { width: 1px; background: #0f3460; }
  #preview { flex: 1; padding: 16px; overflow-y: auto; background: #fff; color: #222; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.6; }
  .toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background: #0f3460; color: #fff; border-radius: 4px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>MD → Rich Text</h1>
  <button onclick="copyRich()">📋 Copy Rich Text</button>
  <label>📂 Upload .md<input type="file" accept=".md,.markdown,.txt" onchange="loadFile(event)"></label>
  <button onclick="clearAll()">✕ Clear</button>
</div>

<div class="panels">
  <div class="panel">
    <div class="panel-header">Markdown Input</div>
    <textarea id="input" spellcheck="false" placeholder="Type or paste Markdown here…"></textarea>
  </div>
  <div class="divider"></div>
  <div class="panel">
    <div class="panel-header">Rich Text Preview</div>
    <div id="preview" contenteditable="false"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Custom renderer to inject inline styles so formatting survives clipboard paste into Word/Quip
const renderer = new marked.Renderer();

const tableBorder = 'border:1px solid #333;';
const cellStyle = `${tableBorder}padding:6px 10px;text-align:left;`;

renderer.table = function(token) {
  let header = '', body = '';
  for (let i = 0; i < token.header.length; i++) {
    header += `<th style="${cellStyle}background:#e8e8e8;font-weight:bold;">${this.parser.parseInline(token.header[i].tokens)}</th>`;
  }
  header = `<tr>${header}</tr>`;
  for (const row of token.rows) {
    let r = '';
    for (const cell of row) {
      r += `<td style="${cellStyle}">${this.parser.parseInline(cell.tokens)}</td>`;
    }
    body += `<tr>${r}</tr>`;
  }
  return `<table style="border-collapse:collapse;${tableBorder}width:100%;margin:12px 0;">${header}${body}</table>`;
};

renderer.heading = function({ tokens, depth }) {
  const sizes = { 1: '2em', 2: '1.5em', 3: '1.25em', 4: '1.1em', 5: '1em', 6: '.9em' };
  const text = this.parser.parseInline(tokens);
  return `<h${depth} style="font-size:${sizes[depth]};margin:16px 0 8px;font-weight:bold;line-height:1.3;">${text}</h${depth}>`;
};

renderer.blockquote = function({ tokens }) {
  const body = this.parser.parse(tokens);
  return `<blockquote style="border-left:4px solid #ccc;margin:12px 0;padding:8px 16px;color:#555;font-style:italic;">${body}</blockquote>`;
};

renderer.code = function({ text, lang }) {
  const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<pre style="background:#2d2d2d;color:#f8f8f2;padding:12px 16px;border-radius:4px;overflow-x:auto;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:1.5;margin:12px 0;white-space:pre-wrap;"><code>${escaped}</code></pre>`;
};

renderer.codespan = function({ text }) {
  return `<code style="background:#f0f0f0;padding:2px 5px;border-radius:3px;font-family:Consolas,'Courier New',monospace;font-size:90%;color:#c7254e;">${text}</code>`;
};

renderer.list = function(token) {
  const tag = token.ordered ? 'ol' : 'ul';
  const type = token.ordered ? `list-style-type:decimal;` : `list-style-type:disc;`;
  let body = '';
  for (const item of token.items) {
    body += this.listitem(item);
  }
  return `<${tag} style="${type}margin:8px 0;padding-left:24px;">${body}</${tag}>`;
};

renderer.listitem = function(item) {
  let text = this.parser.parseInline(item.tokens.filter(t => t.type !== 'list'));
  // Render nested lists
  for (const token of item.tokens) {
    if (token.type === 'list') text += this.list(token);
  }
  return `<li style="margin:3px 0;">${text}</li>`;
};

renderer.hr = function() {
  return `<hr style="border:none;border-top:2px solid #ccc;margin:20px 0;">`;
};

renderer.link = function({ href, title, tokens }) {
  const text = this.parser.parseInline(tokens);
  const t = title ? ` title="${title}"` : '';
  return `<a href="${href}"${t} style="color:#0366d6;text-decoration:underline;" target="_blank">${text}</a>`;
};

renderer.paragraph = function({ tokens }) {
  return `<p style="margin:10px 0;line-height:1.6;">${this.parser.parseInline(tokens)}</p>`;
};

marked.setOptions({ renderer, gfm: true, breaks: true });

const input = document.getElementById('input');
const preview = document.getElementById('preview');

function render() {
  preview.innerHTML = marked.parse(input.value);
}

input.addEventListener('input', render);

async function copyRich() {
  const html = preview.innerHTML;
  if (!html) return toast('Nothing to copy');
  try {
    await navigator.clipboard.write([
      new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }) })
    ]);
    toast('Copied!');
  } catch {
    // Fallback: hidden contenteditable + execCommand
    const tmp = document.createElement('div');
    tmp.contentEditable = true;
    tmp.innerHTML = html;
    tmp.style.position = 'fixed';
    tmp.style.opacity = '0';
    document.body.appendChild(tmp);
    const range = document.createRange();
    range.selectNodeContents(tmp);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    document.body.removeChild(tmp);
    toast('Copied (fallback)!');
  }
}

function loadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { input.value = reader.result; render(); };
  reader.readAsText(file);
  e.target.value = '';
}

function clearAll() {
  input.value = '';
  preview.innerHTML = '';
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

// Seed with sample content
input.value = `# Project Summary

This is a **critical** update for the *Q3 roadmap*.

## Action Items

- Review the proposal
- Approve the budget
  - Sub-item: confirm with finance
- Schedule kickoff

> Note: All deadlines are subject to change.

## Team Roster

| Name  | Role     | Status   |
|-------|----------|----------|
| Alice | Engineer | Active   |
| Bob   | Designer | Inactive |

## Code Example

\`\`\`python
def greet(name):
    return f"Hello, {name}"
\`\`\`

Use \`greet("World")\` to call it.

---

*End of document.*
`;
render();
</script>
</body>
</html>
